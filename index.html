<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>New Tab</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Inter & Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
    }
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    input {
      user-select: text;
    }
    /* Jemný hĺbkový gradient pozadia inšpirovaný tvojou predlohou */
    body {
      background: radial-gradient(circle at 50% 20%, #171836 0%, #0d0f22 65%, #080914 100%);
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Efekt pre hodiny – jemný svetelný odlesk a tieň */
    .clock-glow {
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 40px rgba(255, 255, 255, 0.08);
      letter-spacing: -0.04em;
    }
    /* Sklený efekt (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(147, 197, 253, 0.45);
      outline: none;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
    }
    /* Vlastný scrollbar pre dialóg */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between p-4 sm:p-7 selection:bg-indigo-500 selection:text-white">

  <!-- HORNÁ LIŠTA: Widget Počasia -->
  <header class="w-full flex justify-end items-start z-10">
    <div id="weather-card" onclick="openSettingsModal('weather-section')" class="glass-card cursor-pointer px-4 py-2.5 rounded-2xl flex items-center space-x-3 transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg">
      <div id="weather-icon-wrap" class="text-2xl text-amber-300 flex items-center justify-center">
        <i class="ph ph-sun-dim"></i>
      </div>
      <div class="flex flex-col text-right">
        <div class="flex items-center space-x-1.5 justify-end">
          <span id="weather-temp" class="text-base font-semibold tracking-tight text-white">-- °C</span>
        </div>
        <span id="weather-city" class="text-[11px] font-medium text-slate-400 capitalize max-w-[120px] truncate">Bratislava</span>
      </div>
    </div>
  </header>

  <!-- STREDNÁ SEKCIA: Hodiny, Dátum, Vyhľadávanie a Rýchly prístup -->
  <main class="w-full max-w-2xl mx-auto flex flex-col items-center justify-center text-center my-auto py-8">
    
    <!-- Digitálne hodiny (BEZ SEKÚND) -->
    <div id="clock-display" class="clock-glow text-6xl sm:text-8xl md:text-9xl font-extrabold text-white tracking-tighter leading-none select-none transition-transform duration-200">
      00:00
    </div>

    <!-- Aktuálny dátum -->
    <div id="date-display" class="mt-3 sm:mt-4 text-xs sm:text-sm font-semibold tracking-wide text-slate-300/80 uppercase">
      Načítavam dátum...
    </div>

    <!-- Vyhľadávacie pole -->
    <form id="search-form" class="w-full max-w-lg mt-8 relative group" action="https://www.google.com/search" method="GET">
      <div class="relative flex items-center">
        <div class="absolute left-4 text-slate-400 pointer-events-none text-lg group-focus-within:text-indigo-400 transition-colors">
          <i class="ph ph-magnifying-glass"></i>
        </div>
        <input 
          id="search-query"
          name="q" 
          type="text" 
          autocomplete="off"
          spellcheck="false"
          placeholder="Hľadať na webe..." 
          class="w-full glass-input text-sm sm:text-base text-slate-100 placeholder:text-slate-400/80 rounded-full py-3.5 pl-12 pr-12 transition-all duration-300"
        />
        <button type="submit" class="absolute right-3.5 text-slate-400 hover:text-white p-1 rounded-full transition-colors" title="Hľadať">
          <i class="ph ph-arrow-right font-bold"></i>
        </button>
      </div>
    </form>

    <!-- Rýchly prístup (Dlaždice skratiek pod search barom) -->
    <div id="shortcuts-grid" class="w-full max-w-xl mt-7 flex flex-wrap items-center justify-center gap-3 sm:gap-4">
      <!-- Generuje sa dynamicky cez JS -->
    </div>
  </main>

  <!-- SPODNÁ LIŠTA: AI tlačidlo (vľavo) a Nastavenia (vpravo) -->
  <footer class="w-full flex justify-between items-center z-10 mt-auto pt-4">
    <!-- AI Tlačidlo vľavo dole -->
    <a 
      id="ai-button" 
      href="https://gemini.google.com" 
      target="_self"
      class="glass-card flex items-center space-x-2.5 px-4 py-2.5 rounded-full text-indigo-300 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg group"
      title="Otvoriť AI asistenta"
    >
      <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-400 flex items-center justify-center text-white text-xs shadow-inner">
        <i class="ph ph-sparkle text-sm"></i>
      </div>
      <span class="text-xs sm:text-sm font-semibold tracking-wide">AI</span>
    </a>

    <!-- Nastavenia vpravo dole -->
    <button 
      id="open-settings-btn"
      onclick="openSettingsModal()" 
      class="glass-card w-11 h-11 rounded-full flex items-center justify-center text-slate-300 hover:text-white transition-all duration-300 hover:rotate-45 hover:scale-105 active:scale-95 shadow-lg"
      title="Nastavenia"
    >
      <i class="ph ph-gear text-xl"></i>
    </button>
  </footer>

  <!-- MODÁLNE OKNO NASTAVENÍ -->
  <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/65 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div id="settings-content" class="w-full max-w-md bg-[#131528] border border-white/10 rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto">
      
      <!-- Hlavička modálu -->
      <div class="flex justify-between items-center pb-4 border-b border-white/10">
        <div class="flex items-center space-x-2.5">
          <i class="ph ph-sliders text-indigo-400 text-xl"></i>
          <h2 class="text-lg font-bold text-white">Nastavenia</h2>
        </div>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
          <i class="ph ph-x font-bold"></i>
        </button>
      </div>

      <div class="mt-5 space-y-6">
        
        <!-- Sekcia: Lokalita počasia -->
        <div id="weather-section" class="space-y-2">
          <label class="text-xs font-semibold text-slate-300 flex items-center space-x-1.5">
            <i class="ph ph-map-pin text-indigo-400"></i>
            <span>Mesto / Lokalita pre počasie</span>
          </label>
          <div class="flex space-x-2">
            <input 
              id="input-city" 
              type="text" 
              placeholder="napr. Bratislava, Košice, Poprad..." 
              class="w-full glass-input text-xs sm:text-sm text-slate-100 placeholder:text-slate-500 rounded-xl px-3.5 py-2.5"
            />
            <button 
              onclick="saveCitySetting()" 
              class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md active:scale-95 shrink-0"
            >
              Uložiť
            </button>
          </div>
          <p id="weather-status-msg" class="text-[11px] text-slate-400"></p>
        </div>

        <!-- Sekcia: AI Tlačidlo URL -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-300 flex items-center space-x-1.5">
            <i class="ph ph-sparkle text-purple-400"></i>
            <span>Cieľová stránka pre tlačidlo AI</span>
          </label>
          <div class="flex space-x-2">
            <input 
              id="input-ai-url" 
              type="url" 
              placeholder="https://gemini.google.com" 
              class="w-full glass-input text-xs sm:text-sm text-slate-100 placeholder:text-slate-500 rounded-xl px-3.5 py-2.5"
            />
            <button 
              onclick="saveAiSetting()" 
              class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md active:scale-95 shrink-0"
            >
              Uložiť
            </button>
          </div>
          <p class="text-[11px] text-slate-400">Predvolené: https://gemini.google.com</p>
        </div>

        <!-- Sekcia: Rýchly prístup (Správa skratiek) -->
        <div class="space-y-3 pt-2 border-t border-white/10">
          <div class="flex justify-between items-center">
            <label class="text-xs font-semibold text-slate-300 flex items-center space-x-1.5">
              <i class="ph ph-bookmark-simple text-amber-400"></i>
              <span>Rýchly prístup (Skratky)</span>
            </label>
            <span class="text-[11px] text-slate-400" id="shortcut-count">0/8</span>
          </div>

          <!-- Formulár pre pridanie skratky -->
          <div class="bg-white/5 p-3 rounded-2xl border border-white/5 space-y-2">
            <input 
              id="input-sc-title" 
              type="text" 
              placeholder="Názov (napr. YouTube)" 
              class="w-full glass-input text-xs text-slate-100 placeholder:text-slate-500 rounded-lg px-3 py-2"
            />
            <div class="flex space-x-2">
              <input 
                id="input-sc-url" 
                type="url" 
                placeholder="https://youtube.com" 
                class="w-full glass-input text-xs text-slate-100 placeholder:text-slate-500 rounded-lg px-3 py-2"
              />
              <button 
                onclick="addShortcut()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-all active:scale-95 shrink-0"
              >
                + Pridať
              </button>
            </div>
          </div>

          <!-- Zoznam existujúcich skratiek -->
          <div id="shortcuts-manage-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
            <!-- Dynamicky generovaný zoznam -->
          </div>
        </div>

      </div>

      <div class="mt-6 pt-4 border-t border-white/10 flex justify-end">
        <button onclick="closeSettingsModal()" class="w-full bg-white/10 hover:bg-white/15 text-white text-xs font-semibold py-2.5 rounded-xl transition-colors">
          Hotovo
        </button>
      </div>

    </div>
  </div>

  <script>
    /* ========================================================
       1. ČAS A DÁTUM (Bez sekúnd, formát: HH:MM po slovensky)
       ======================================================== */
    const clockEl = document.getElementById('clock-display');
    const dateEl = document.getElementById('date-display');

    const dni = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];
    const mesiace = ['Januára', 'Februára', 'Marca', 'Apríla', 'Mája', 'Júna', 'Júla', 'Augusta', 'Septembra', 'Októbra', 'Novembra', 'Decembra'];

    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      clockEl.textContent = `${h}:${m}`;

      const den = dni[now.getDay()];
      const datum = now.getDate();
      const mesiac = mesiace[now.getMonth()];
      const rok = now.getFullYear();
      dateEl.textContent = `${den} ${datum}. ${mesiac} ${rok}`;
    }

    updateTime();
    // Aktualizácia každú sekundu pre presný prechod minúty
    setInterval(updateTime, 1000);

    /* ========================================================
       2. ÚLOŽISKO A NASTAVENIA (localStorage)
       ======================================================== */
    const DEFAULT_CITY = 'Bratislava';
    const DEFAULT_AI_URL = 'https://gemini.google.com';
    const DEFAULT_SHORTCUTS = [
      { id: '1', title: 'YouTube', url: 'https://youtube.com' },
      { id: '2', title: 'Reddit', url: 'https://reddit.com' },
      { id: '3', title: 'GitHub', url: 'https://github.com' },
      { id: '4', title: 'Správy', url: 'https://sme.sk' }
    ];

    function getStorage(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.error('Chyba pri ukladaní do localStorage:', e);
      }
    }

    /* ========================================================
       3. AI TLAČIDLO
       ======================================================== */
    function applyAiButton() {
      const aiUrl = getStorage('tab_ai_url', DEFAULT_AI_URL);
      const aiBtn = document.getElementById('ai-button');
      aiBtn.href = aiUrl;
    }

    function saveAiSetting() {
      const input = document.getElementById('input-ai-url');
      let val = input.value.trim();
      if (!val) val = DEFAULT_AI_URL;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = 'https://' + val;
      }
      setStorage('tab_ai_url', val);
      applyAiButton();
      showStatusMessage('Adresa AI uložená!');
    }

    /* ========================================================
       4. POČASIE (Open-Meteo API bez nutnosti API kľúča)
       ======================================================== */
    const weatherTempEl = document.getElementById('weather-temp');
    const weatherCityEl = document.getElementById('weather-city');
    const weatherIconWrap = document.getElementById('weather-icon-wrap');

    // Prevod WMO kódov na ikony Phosphor
    function getWeatherIcon(code, isDay = 1) {
      if (code === 0) return isDay ? 'ph-sun' : 'ph-moon';
      if (code >= 1 && code <= 3) return isDay ? 'ph-cloud-sun' : 'ph-cloud-moon';
      if (code >= 45 && code <= 48) return 'ph-cloud-fog';
      if (code >= 51 && code <= 67) return 'ph-cloud-rain';
      if (code >= 71 && code <= 77) return 'ph-snowflake';
      if (code >= 80 && code <= 82) return 'ph-cloud-shower';
      if (code >= 85 && code <= 86) return 'ph-snowflake';
      if (code >= 95) return 'ph-cloud-lightning';
      return 'ph-cloud';
    }

    async function fetchWeather(cityName) {
      weatherCityEl.textContent = cityName;
      try {
        // 1. Získanie súradníc pre mesto cez geocoding
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=sk&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('Mesto sa nenašlo');
        }

        const location = geoData.results[0];
        const lat = location.latitude;
        const lon = location.longitude;
        weatherCityEl.textContent = location.name;

        // 2. Načítanie aktuálnej teploty a počasia
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day`);
        const weatherData = await weatherRes.json();

        const current = weatherData.current;
        const temp = Math.round(current.temperature_2m);
        const iconClass = getWeatherIcon(current.weather_code, current.is_day);

        weatherTempEl.textContent = `${temp} °C`;
        weatherIconWrap.innerHTML = `<i class="ph ${iconClass} text-2xl text-amber-300"></i>`;
      } catch (err) {
        console.warn('Počasie sa nepodarilo načítať online, použité predvolené zobrazenie:', err);
        weatherTempEl.textContent = `15 °C`;
        weatherCityEl.textContent = cityName;
        weatherIconWrap.innerHTML = `<i class="ph ph-sun text-2xl text-amber-300"></i>`;
      }
    }

    function saveCitySetting() {
      const input = document.getElementById('input-city');
      const val = input.value.trim();
      if (!val) return;
      setStorage('tab_weather_city', val);
      fetchWeather(val);
      showStatusMessage(`Lokalita "${val}" uložená!`);
    }

    /* ========================================================
       5. RÝCHLY PRÍSTUP (Skratky pod vyhľadávacím poľom)
       ======================================================== */
    function renderShortcuts() {
      const shortcuts = getStorage('tab_shortcuts', DEFAULT_SHORTCUTS);
      const container = document.getElementById('shortcuts-grid');
      const manageList = document.getElementById('shortcuts-manage-list');
      const countEl = document.getElementById('shortcut-count');

      container.innerHTML = '';
      manageList.innerHTML = '';
      countEl.textContent = `${shortcuts.length}/8`;

      // Vykreslenie dlaždíc na ploche
      shortcuts.forEach(sc => {
        let hostname = '';
        try {
          hostname = new URL(sc.url).hostname;
        } catch (e) {
          hostname = sc.url;
        }

        const tile = document.createElement('a');
        tile.href = sc.url;
        tile.className = "glass-card group flex items-center space-x-2.5 px-3.5 py-2 rounded-2xl transition-all duration-300 hover:scale-105 active:scale-95 shadow-md";
        tile.title = sc.title;

        // Google favicon service pre spoľahlivé ikonky webov
        const iconUrl = `https://www.google.com/s2/favicons?sz=64&domain=${hostname}`;

        tile.innerHTML = `
          <img src="${iconUrl}" alt="" class="w-4 h-4 rounded-full opacity-80 group-hover:opacity-100 transition-opacity" onerror="this.src='https://placehold.co/32x32/1e293b/94a3b8?text=•'"/>
          <span class="text-xs font-medium text-slate-200 group-hover:text-white transition-colors truncate max-w-[100px]">${sc.title}</span>
        `;
        container.appendChild(tile);
      });

      // Vykreslenie položiek v okne nastavení
      if (shortcuts.length === 0) {
        manageList.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">Žiadne pridané skratky</div>`;
      } else {
        shortcuts.forEach(sc => {
          const item = document.createElement('div');
          item.className = "flex items-center justify-between bg-white/5 px-3 py-2 rounded-xl border border-white/5 text-xs";
          item.innerHTML = `
            <div class="flex items-center space-x-2 truncate pr-2">
              <span class="font-semibold text-slate-200">${sc.title}</span>
              <span class="text-[11px] text-slate-400 truncate max-w-[150px]">${sc.url}</span>
            </div>
            <button onclick="removeShortcut('${sc.id}')" class="text-rose-400 hover:text-rose-300 p-1 rounded-md transition-colors" title="Odstrániť">
              <i class="ph ph-trash text-sm"></i>
            </button>
          `;
          manageList.appendChild(item);
        });
      }
    }

    function addShortcut() {
      const titleInput = document.getElementById('input-sc-title');
      const urlInput = document.getElementById('input-sc-url');
      const title = titleInput.value.trim();
      let url = urlInput.value.trim();

      if (!title || !url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const shortcuts = getStorage('tab_shortcuts', DEFAULT_SHORTCUTS);
      if (shortcuts.length >= 8) {
        showStatusMessage('Dosiahnutý maximálny limit 8 skratiek.');
        return;
      }

      shortcuts.push({
        id: Date.now().toString(),
        title,
        url
      });

      setStorage('tab_shortcuts', shortcuts);
      titleInput.value = '';
      urlInput.value = '';
      renderShortcuts();
    }

    function removeShortcut(id) {
      let shortcuts = getStorage('tab_shortcuts', DEFAULT_SHORTCUTS);
      shortcuts = shortcuts.filter(sc => sc.id !== id);
      setStorage('tab_shortcuts', shortcuts);
      renderShortcuts();
    }

    /* ========================================================
       6. OVLÁDANIE NASTAVENÍ (MODAL)
       ======================================================== */
    const modal = document.getElementById('settings-modal');
    const modalContent = document.getElementById('settings-content');

    function openSettingsModal(targetId = null) {
      // Predvyplnenie polí
      document.getElementById('input-city').value = getStorage('tab_weather_city', DEFAULT_CITY);
      document.getElementById('input-ai-url').value = getStorage('tab_ai_url', DEFAULT_AI_URL);

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('scale-95');
      modalContent.classList.add('scale-100');

      if (targetId) {
        setTimeout(() => {
          const el = document.getElementById(targetId);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 150);
      }
    }

    function closeSettingsModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.add('scale-95');
      modalContent.classList.remove('scale-100');
      document.getElementById('weather-status-msg').textContent = '';
    }

    // Zatvorenie pri kliknutí mimo okna
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeSettingsModal();
    });

    function showStatusMessage(msg) {
      const el = document.getElementById('weather-status-msg');
      el.textContent = msg;
      el.classList.add('text-indigo-400');
      setTimeout(() => {
        el.textContent = '';
      }, 3000);
    }

    /* ========================================================
       7. INICIALIZÁCIA PRI ŠTARTE
       ======================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Nastavenie AI
      applyAiButton();
      // 2. Skratky
      renderShortcuts();
      // 3. Počasie
      const savedCity = getStorage('tab_weather_city', DEFAULT_CITY);
      fetchWeather(savedCity);
    });
  </script>
</body>
</html>
