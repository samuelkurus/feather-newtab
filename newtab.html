<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nová karta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Počasie v pravom hornom rohu */
        .weather-card {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .weather-icon {
            font-size: 28px;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
        }

        .weather-temp {
            font-size: 20px;
            font-weight: 700;
        }

        .weather-city {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Centrálny blok s hodinami */
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .clock {
            font-size: 88px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .date {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-transform: capitalize;
        }

        /* Vyhľadávacie pole v štýle Crystal */
        .search-box {
            margin-top: 35px;
            width: 480px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 22px;
            font-size: 16px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Tlačidlo nastavení v pravom dolnom rohu */
        .settings-btn {
            position: absolute;
            bottom: 25px;
            right: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: rotate(45deg);
        }

        /* Dialógové okno nastavení */
        .settings-modal {
            display: none;
            position: absolute;
            bottom: 80px;
            right: 30px;
            background: #1e1e24;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 18px;
            border-radius: 14px;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(20px);
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .settings-input {
            width: 100%;
            padding: 9px 12px;
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .settings-input:focus {
            border-color: #0078D4;
        }

        .settings-save-btn {
            background: #0078D4;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .settings-save-btn:hover {
            background: #0086f0;
        }
    </style>
</head>
<body>

    <!-- Widget počasia -->
    <div class="weather-card">
        <div class="weather-icon" id="weatherIcon">🌤️</div>
        <div class="weather-info">
            <span class="weather-temp" id="weatherTemp">-- °C</span>
            <span class="weather-city" id="weatherCity">Bratislava</span>
        </div>
    </div>

    <!-- Hlavné hodiny a vyhľadávanie -->
    <div class="center-container">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">Načítavam dátum...</div>

        <form class="search-box" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" class="search-input" placeholder="Hľadať na webe..." autofocus autocomplete="off">
        </form>
    </div>

    <!-- Tlačidlo v pravom dolnom rohu -->
    <div class="settings-btn" id="settingsToggle" title="Nastavenia karty">⚙️</div>

    <!-- Vyskakovacie okno nastavení -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-title">Lokalita počasia</div>
        <input type="text" id="cityInput" class="settings-input" placeholder="Napr. Bratislava, Poprad...">
        <button class="settings-save-btn" id="saveCityBtn">Uložiť polohu</button>
    </div>

    <script>
        // Logika hodín a dátumu
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('sk-SK', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Predvolené hodnoty (Bratislava)
        const DEFAULT_CITY = "Bratislava";
        const DEFAULT_LAT = 48.1486;
        const DEFAULT_LON = 17.1077;

        async function fetchWeather(latitude, longitude, name) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const data = await response.json();
                
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;

                document.getElementById('weatherTemp').textContent = `${temp} °C`;
                document.getElementById('weatherCity').textContent = name;
                document.getElementById('weatherIcon').textContent = getWeatherEmoji(code);
            } catch (err) {
                document.getElementById('weatherTemp').textContent = "-- °C";
            }
        }

        function getWeatherEmoji(code) {
            if (code === 0) return "☀️";
            if (code >= 1 && code <= 3) return "🌤️";
            if (code >= 45 && code <= 48) return "🌫️";
            if (code >= 51 && code <= 67) return "🌧️";
            if (code >= 71 && code <= 77) return "❄️";
            if (code >= 80 && code <= 82) return "🌦️";
            if (code >= 95) return "⛈️";
            return "🌡️";
        }

        // Hľadanie súradníc podľa názvu mesta cez Open-Meteo Geocoding
        async function setCityByName(cityName) {
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=sk&format=json`);
                const geoData = await geoRes.json();

                if (geoData.results && geoData.results.length > 0) {
                    const result = geoData.results[0];
                    const selectedName = result.name;
                    const lat = result.latitude;
                    const lon = result.longitude;

                    // Uloženie do pamäte prehliadača
                    localStorage.setItem("saved_city_name", selectedName);
                    localStorage.setItem("saved_city_lat", lat);
                    localStorage.setItem("saved_city_lon", lon);

                    fetchWeather(lat, lon, selectedName);
                    return true;
                } else {
                    alert("Mesto sa nepodarilo nájsť. Skúste iný názov.");
                    return false;
                }
            } catch (e) {
                alert("Chyba pri hľadaní lokality.");
                return false;
            }
        }

        // Inicializácia pri načítaní stránky
        const savedName = localStorage.getItem("saved_city_name") || DEFAULT_CITY;
        const savedLat = localStorage.getItem("saved_city_lat") || DEFAULT_LAT;
        const savedLon = localStorage.getItem("saved_city_lon") || DEFAULT_LON;

        fetchWeather(savedLat, savedLon, savedName);

        // Ovládanie modálneho okna nastavení
        const settingsToggle = document.getElementById("settingsToggle");
        const settingsModal = document.getElementById("settingsModal");
        const cityInput = document.getElementById("cityInput");
        const saveCityBtn = document.getElementById("saveCityBtn");

        settingsToggle.addEventListener("click", () => {
            settingsModal.classList.toggle("active");
            if (settingsModal.classList.contains("active")) {
                cityInput.value = localStorage.getItem("saved_city_name") || DEFAULT_CITY;
                cityInput.focus();
            }
        });

        saveCityBtn.addEventListener("click", async () => {
            const val = cityInput.value.trim();
            if (val) {
                const ok = await setCityByName(val);
                if (ok) settingsModal.classList.remove("active");
            }
        });

        cityInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                saveCityBtn.click();
            }
        });
    </script>
</body>
</html>
